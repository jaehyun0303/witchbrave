<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>위치브레이브 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0d0a1a;--panel:#1a1430;--line:#3a2f66;--ink:#eee8ff;--dim:#9a90c4;--gold:#ffd166}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,"Noto Sans KR",sans-serif;overflow-x:hidden}
  h1{margin:0 0 4px;letter-spacing:.05em}
  .sub{color:var(--dim);font-size:14px;margin-bottom:12px}
  .bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:10px 0}
  .coins{color:var(--gold);font-weight:700}
  select,button{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit}
  button{cursor:pointer}button:hover:not(:disabled){border-color:#8f7bff}button:disabled{opacity:.45;cursor:not-allowed}
  button.go{background:#5b3bd6;border-color:#8f7bff;font-weight:700;padding:10px 22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .card{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px}
  .card.sel{border-color:#8f7bff;box-shadow:0 0 14px #6b4bff66}.card.locked .name{opacity:.6}
  .name{font-weight:700;font-size:17px}.tag{font-size:12px;color:var(--dim)}
  .sk{font-size:12.5px;color:#cfc6f5;margin:3px 0;line-height:1.4}.sk b{color:#fff}.tmp{color:#ffb86b}
  .help{font-size:13px;color:var(--dim);margin-top:14px;line-height:1.7}

  /* ---- 게임 화면 ---- */
  #game{display:none;position:fixed;inset:0;background:#000;user-select:none}
  #cv{width:100%;height:100%;display:block;cursor:crosshair}
  #hud{position:absolute;inset:0;pointer-events:none;transition:opacity .4s}
  .cinema #hud{opacity:0}
  .hpanel{position:absolute;top:14px;width:min(380px,44vw)}
  .hpanel.left{left:16px}.hpanel.right{right:16px;text-align:right}
  .pname{font-weight:800;font-size:15px;text-shadow:0 2px 6px #000}
  .hpbar{position:relative;height:22px;background:#000a;border:1px solid #fff3;border-radius:4px;overflow:hidden;margin-top:3px}
  .hpfill,.hpghost{position:absolute;top:0;bottom:0}.hpanel.left .hpfill,.hpanel.left .hpghost{left:0}.hpanel.right .hpfill,.hpanel.right .hpghost{right:0}
  .hpfill{background:linear-gradient(#6fd6ff,#3a8cff)}.right .hpfill{background:linear-gradient(#ffa070,#ff5a5a)}
  .hpghost{background:#fff8}
  .shfill{position:absolute;top:0;height:8px;background:linear-gradient(#fff,#ffc4e8);box-shadow:0 0 6px #ffc4e8}.hpanel.left .shfill{left:0}.hpanel.right .shfill{right:0}
  .hptxt{position:absolute;inset:0;font-size:12px;line-height:22px;padding:0 8px;text-shadow:0 1px 3px #000}
  .skills{position:fixed;bottom:16px;display:flex;gap:8px}
  .left .skills{left:16px}.right .skills{right:16px}
  .slot{position:relative;width:88px;height:62px;background:#0009;border:2px solid #fff3;border-radius:8px;overflow:hidden;padding:5px 6px;text-align:left}
  .slot.ready{border-color:#b6a4ff}
  .slot i{font-style:normal;font-weight:800;font-size:15px}.slot span{position:absolute;left:6px;bottom:5px;font-size:11px;opacity:.9;max-width:76px;white-space:nowrap;overflow:hidden}
  .cdm{position:absolute;left:0;right:0;bottom:0;background:#000a}.cdt{position:absolute;right:6px;top:4px;font-size:16px}
  .tag3d{position:absolute;left:0;top:0;text-align:center;white-space:nowrap}
  .mini{width:70px;height:6px;background:#000a;border-radius:3px;overflow:hidden;margin:0 auto}.mini div{height:100%;background:#ff5a6e}
  .ic{font-size:16px;height:20px}
  .dmg{position:absolute;left:0;top:0;font-weight:900;font-size:22px;text-shadow:0 2px 0 #000,0 0 8px #000;white-space:nowrap}
  .dmg.big{font-size:30px}
  #toast{position:absolute;top:96px;left:50%;transform:translateX(-50%);color:var(--gold);font-weight:800;font-size:18px;opacity:0;transition:opacity .3s;text-shadow:0 2px 6px #000;pointer-events:none}
  #mindtimer{position:absolute;top:60px;left:50%;transform:translateX(-50%);color:#ff7ad9;font-weight:800;text-shadow:0 0 10px #ff3fc8;display:none}
  #flash{position:absolute;inset:0;pointer-events:none;opacity:0}
  .bars:before,.bars:after{content:"";position:absolute;left:0;right:0;height:0;background:#000;transition:height .6s;pointer-events:none;z-index:5}
  .bars:before{top:0}.bars:after{bottom:0}
  .cinema.bars:before,.cinema.bars:after{height:12vh}
  #ctitle{position:absolute;left:0;right:0;bottom:17vh;text-align:center;opacity:0;pointer-events:none;z-index:6}
  #ctitle div{font-size:clamp(34px,6vw,76px);font-weight:900;letter-spacing:.3em;color:#eef3ff;text-shadow:0 0 24px #7d9bff,0 0 60px #4a6bff;padding-left:.3em}
  #ctitle small{display:block;font-size:16px;letter-spacing:.5em;color:#9bb0ff;margin-top:6px}
  #ctitle.show{animation:tin 1.6s ease-out forwards}
  @keyframes ldblink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(1.06)}}
  @keyframes tin{0%{opacity:0;letter-spacing:.9em;transform:scale(1.15)}30%{opacity:1}100%{opacity:1;letter-spacing:.3em;transform:scale(1)}}
  .vig:after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,#0000 40%,#000b 100%);z-index:4}
  #result{position:absolute;inset:0;background:#000b;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;font-size:34px;font-weight:800;z-index:10}
  #result small{font-size:16px;font-weight:400;color:var(--gold)}
  #hint{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);font-size:12px;color:#fff8;pointer-events:none}
  #intro{position:absolute;inset:0;display:none;z-index:50;overflow:hidden;pointer-events:none;font-family:system-ui,"Noto Sans KR",sans-serif}
  #intro.on{display:block}
  #intro .bg{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#2a1a66aa,#05030fdd 70%);opacity:0;transition:opacity .35s}
  #intro.show .bg{opacity:1}
  #intro .ip{position:absolute;top:50%;width:46%;height:56%;transform:translateY(-50%);display:flex;flex-direction:column;justify-content:center;gap:10px;padding:0 4%;color:#fff;transition:transform .55s cubic-bezier(.2,.9,.2,1),opacity .4s;opacity:0}
  #intro .ip.l{left:0;background:linear-gradient(100deg,#3a8cffcc,#3a8cff00);transform:translate(-110%,-50%) skewX(-8deg)}
  #intro .ip.r{right:0;text-align:right;align-items:flex-end;background:linear-gradient(260deg,#ff5a5acc,#ff5a5a00);transform:translate(110%,-50%) skewX(-8deg)}
  #intro.show .ip{opacity:1}#intro.show .ip.l{transform:translate(0,-50%) skewX(-8deg)}#intro.show .ip.r{transform:translate(0,-50%) skewX(-8deg)}
  #intro .ip b{font-size:clamp(26px,4.4vw,64px);letter-spacing:.02em;text-shadow:0 4px 18px #000a}
  #intro .ip small{font-size:clamp(13px,1.6vw,22px);opacity:.85}
  #intro .vs{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);font-size:clamp(60px,10vw,150px);font-weight:900;color:#ffd166;text-shadow:0 0 30px #ffb300,0 6px 0 #7a4a00;transition:transform .45s cubic-bezier(.3,1.6,.4,1) .35s}
  #intro.show .vs{transform:translate(-50%,-50%) scale(1)}
  #intro.count .ip,#intro.count .vs{opacity:0;transition:opacity .25s}
  #intro .cd{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(90px,16vw,240px);font-weight:900;color:#fff;text-shadow:0 0 40px #8f7bff,0 8px 0 #3a2a99;opacity:0}
  #intro .cd.pop{animation:cdpop .6s ease-out}
  @keyframes cdpop{0%{transform:translate(-50%,-50%) scale(2.2);opacity:0}25%{opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
  #lobby{position:fixed;inset:0;z-index:20;display:none;pointer-events:none;color:var(--ink);font-family:system-ui,"Noto Sans KR",sans-serif}
  #lobby button,#lobby select,#lobby label{pointer-events:auto}
  .lb-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:linear-gradient(#05030fcc,#05030f00)}
  .lb-profile{display:flex;flex-direction:column;gap:2px;font-size:13px}.lb-profile b{font-size:18px}.lb-profile span{color:var(--gold);font-weight:700}
  .lb-icon{width:44px;height:44px;border-radius:12px;font-size:22px;padding:0}
  .lb-left{position:absolute;left:18px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
  .lb-nav{position:relative;width:92px;height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:14px;background:#1a1430dd;border:2px solid #5a4aa6;font-size:14px;font-weight:700}
  .lb-nav i{font-style:normal;font-size:28px}.lb-nav:hover{border-color:#b6a4ff;background:#2a2060e6}
  .lb-nav em{position:absolute;top:6px;right:8px;width:12px;height:12px;border-radius:50%;background:#ff4f6d;display:none}.lb-nav em.on{display:block}
  .lb-info{position:absolute;left:0;right:0;bottom:130px;text-align:center;text-shadow:0 3px 14px #000}
  #lname{font-size:clamp(24px,3.4vw,44px);font-weight:900;letter-spacing:.02em}#lsub{font-size:14px;color:#cfc6f5;margin-top:4px}
  .lb-bottom{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:18px;background:linear-gradient(#05030f00,#05030fcc);flex-wrap:wrap}
  .lb-mode{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}.lb-mode label{display:flex;flex-direction:column;gap:4px;color:var(--dim)}
  .lb-play{min-width:210px;height:76px;font-size:32px;font-weight:900;letter-spacing:.08em;border-radius:14px;color:#3a2200;background:linear-gradient(#ffe27a,#ffb300);border:3px solid #fff3b0;box-shadow:0 6px 0 #a86a00,0 10px 30px #ffb30066}
  .lb-play:hover:not(:disabled){filter:brightness(1.08);border-color:#fff}
  .panel{position:fixed;inset:0;z-index:40;background:#0d0a1af5;overflow:auto;display:none}.panel.open{display:block}
  .pbody{width:min(1100px,100%);margin:0 auto;padding:16px}
  .phead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.phead h2{margin:0}
  .evgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-top:12px}
  .evc{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
  .evc.done{border-color:#7dff9b}.evc b{font-size:16px}.evc .pb{height:10px;background:#000a;border-radius:6px;overflow:hidden}.evc .pb i{display:block;height:100%;background:linear-gradient(#ffe27a,#ffb300)}
  .evc .rw{color:var(--gold);font-weight:700}
  .gbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}
  .gtable{font-size:13px;color:var(--dim);margin-bottom:10px;line-height:1.6}
  .gres{display:flex;flex-wrap:wrap;gap:10px}
  .gr{min-width:120px;padding:10px 12px;border-radius:10px;background:var(--panel);border:2px solid var(--line);animation:grpop .5s ease-out both;font-weight:700}
  .gr.c{border-color:#ffd166;color:#ffd166}.gr.n{border-color:#b6a4ff;color:#e9e0ff;box-shadow:0 0 18px #b6a4ff88}
  @keyframes grpop{0%{transform:scale(.4) rotate(-8deg);opacity:0}100%{transform:none;opacity:1}}
  #game.lobbymode{background:transparent;pointer-events:none;z-index:60}
#rotwarn{display:none;position:fixed;inset:0;z-index:99999;background:#1c1030;color:#fff;font-family:Jua,sans-serif;text-align:center;flex-direction:column;align-items:center;justify-content:center}
@media (orientation:portrait) and (max-width:900px){#rotwarn{display:flex}}
</style>
</head>
<body>
<div id="rotwarn"><div style="font-size:64px">📱↻</div><div style="font-size:24px;margin-top:10px">가로 화면으로 돌려주세요</div><div style="font-size:15px;opacity:.7;margin-top:6px">화면을 눕히면 게임이 꽉 차게 보여요</div></div>
<div id="intro"><div class="bg"></div><div class="ip l"></div><div class="ip r"></div><div class="vs">VS</div><div class="cd"></div></div>
<div id="game" class="bars">
  <canvas id="cv"></canvas>
  <div id="hud"></div>
  <div id="toast"></div><div id="mindtimer"></div><div id="flash"></div><div id="ctitle"></div>
  <div id="result"><div id="rtext"></div><small id="rsub"></small><button class="go" id="back">캐릭터 선택으로</button></div>
</div>
<script src="game.js"></script>
</body>
</html>
